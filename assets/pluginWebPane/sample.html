<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Assistant</title>
<style>
  /* Adaptive theme — matches the user's OS Light / Dark setting via
   * prefers-color-scheme. Defaults to light because the OES Designer
   * Aqua chrome is light, and a black pane sandwiched between white
   * AUI tabs reads as "broken extension." Dark mode kicks in only
   * when the OS itself is in dark mode. */
  :root {
    color-scheme: light dark;
    --bg:        #f6f6f7;
    --fg:        #1d1d1f;
    --muted:     #6b6b70;
    --panel-bg:  #ffffff;
    --panel-fg:  #1d1d1f;
    --border:    #d6d6d8;
    --row-bg:    #f0f0f2;
    --input-bg:  #ffffff;
    --input-fg:  #1d1d1f;
    --input-bd:  #c0c0c4;
    --accent:    #2762d4;
    --accent-fg: #ffffff;
    --you-fg:    #2762d4;
    --host-fg:   #1d1d1f;
    --raw-fg:    #c25b00;
    --err-bg:    #ffe9e9;
    --err-bd:    #d33;
    --err-fg:    #a30000;
    --refusal-bg:#fff5d6;
    --refusal-bd:#caa238;
    --refusal-fg:#6b4d0a;
    --stream-fg: #1d6e2c;
    --footer-fg: #888;
    --chip-bg:   #ececef;
    --chip-bd:   #c0c0c4;
    --chip-fg:   #444;
    --plan-bg:   #fff5d6;
    --plan-bd:   #caa238;
    --plan-fg:   #5a4108;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #1e1e1e;
      --fg:        #e0e0e0;
      --muted:     #aaa;
      --panel-bg:  #252525;
      --panel-fg:  #e0e0e0;
      --border:    #333;
      --row-bg:    #252525;
      --input-bg:  #1a1a1a;
      --input-fg:  #e0e0e0;
      --input-bd:  #444;
      --accent:    #3a6ea5;
      --accent-fg: #fff;
      --you-fg:    #6aa9ff;
      --host-fg:   #e0e0e0;
      --raw-fg:    #ffaa55;
      --err-bg:    #2a1d1d;
      --err-bd:    #ff5555;
      --err-fg:    #ff9999;
      --refusal-bg:#2a2516;
      --refusal-bd:#d49a32;
      --refusal-fg:#f0d28a;
      --stream-fg: #c0e0c0;
      --footer-fg: #888;
      --chip-bg:   #2a2a2a;
      --chip-bd:   #444;
      --chip-fg:   #ccc;
      --plan-bg:   #2a2516;
      --plan-bd:   #d49a32;
      --plan-fg:   #f0d28a;
    }
  }

  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; display: flex; flex-direction: column; height: 100vh; }
  #bar { padding: 8px 12px; font-size: 16px; font-weight: bold; border-bottom: 1px solid var(--border); background: var(--panel-bg); color: var(--panel-fg); }
  #log { flex: 1; overflow-y: auto; padding: 8px 12px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  #log .row { margin: 4px 0; }
  #log .you { color: var(--you-fg); }
  #log .host { color: var(--host-fg); }
  #log .raw { color: var(--raw-fg); }
  #log .err { background: var(--err-bg); border-left: 3px solid var(--err-bd); padding: 4px 8px; color: var(--err-fg); }
  #log .refusal { background: var(--refusal-bg); border-left: 3px solid var(--refusal-bd); padding: 4px 8px; color: var(--refusal-fg); }
  #log .stream { color: var(--stream-fg); }
  #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); }
  #empty[hidden] { display: none !important; }
  #log[hidden]   { display: none !important; }
  #empty .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; max-width: 480px; }
  #empty .chip { background: var(--chip-bg); border: 1px solid var(--chip-bd); border-radius: 14px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--chip-fg); }
  #empty .chip:hover { background: var(--row-bg); border-color: var(--accent); color: var(--fg); }
  #row { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--panel-bg); }
  #input { flex: 1; background: var(--input-bg); color: var(--input-fg); border: 1px solid var(--input-bd); padding: 6px 8px; font-family: inherit; font-size: 14px; outline: none; }
  #input:focus { border-color: var(--accent); }
  #send { background: var(--accent); color: var(--accent-fg); border: 0; padding: 6px 14px; cursor: pointer; font-size: 14px; }
  #send:hover { filter: brightness(1.1); }
  #footer { padding: 4px 12px; font-size: 11px; color: var(--footer-fg); border-top: 1px solid var(--border); background: var(--bg); min-height: 16px; }
  #bar { display: flex; align-items: center; justify-content: space-between; }
  #mode { background: var(--chip-bg); border: 1px solid var(--chip-bd); color: var(--chip-fg); padding: 2px 8px; font-size: 12px; border-radius: 12px; cursor: pointer; }
  #mode.plan { background: var(--plan-bg); border-color: var(--plan-bd); color: var(--plan-fg); }
  #mode.agent { background: var(--refusal-bg); border-color: var(--refusal-bd); color: var(--refusal-fg); }
  #log .plan { background: var(--plan-bg); border-left: 3px solid var(--plan-bd); padding: 8px 12px; }
  #log .plan .title { font-weight: bold; color: var(--plan-fg); margin-bottom: 4px; }
  #log .plan .mutations { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  #log .plan .actions { margin-top: 6px; display: flex; gap: 6px; }
  #log .plan button { padding: 4px 10px; font-size: 12px; border: 0; border-radius: 4px; cursor: pointer; }
  #log .plan .approve { background: #4caf50; color: #fff; }
  #log .plan .reject { background: #555; color: #fff; }
  #log .applied { background: #1e3a2a; border-left: 3px solid #4caf50; padding: 4px 10px; color: #a5d6a7; display: flex; justify-content: space-between; align-items: center; }
  #log .applied .undo { background: transparent; border: 1px solid #4caf50; color: #a5d6a7; padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }
</style>
</head>
<body>
<div id="bar"><span id="title">AI Assistant</span><span id="mode" title="Click to toggle Chat / Agent / Plan">chat</span></div>
<div id="log"></div>
<div id="empty" hidden>
  <div id="emptyLabel">Send a prompt to get started.</div>
  <div class="chips" id="chips"></div>
</div>
<div id="row">
  <input type="text" id="input" autocomplete="off">
  <button id="send">Send</button>
</div>
<div id="footer"></div>
<script>
(function () {
  // Locale dispatch — picks Russian when the browser/wxWebView locale
  // starts with "ru", falls back to English otherwise. Real plugin
  // bundles can extend this dict; for the host demo we cover only
  // the two languages the Designer ships UI in today.
  var lang = (navigator.language || "en").toLowerCase().startsWith("ru")
    ? "ru" : "en";
  var L = {
    en: {
      title:    "AI Assistant",
      empty:    "Send a prompt to get started.",
      ask:      "ask anything…",
      send:     "Send",
      chips: [
        "Explain selected code",
        "Review code for issues",
        "Generate doc comment"
      ],
      noChannel: "[ERR] oesHost channel not wired",
      opExplain: "Explain the following code",
      opReview:  "Review the following code",
      opFix:     "Fix the following code",
      opDoc:     "Write a doc comment for",
      opSend:    "Discuss this code"
    },
    ru: {
      title:    "AI Assistant",
      empty:    "Отправьте запрос для начала.",
      ask:      "введите запрос…",
      send:     "Отправить",
      chips: [
        "Объясни выделенный код",
        "Проверь код на ошибки",
        "Сгенерируй документирующий комментарий"
      ],
      noChannel: "[ОШИБКА] канал oesHost не подключён",
      opExplain: "Объясни следующий код",
      opReview:  "Проверь следующий код",
      opFix:     "Исправь следующий код",
      opDoc:     "Сгенерируй документирующий комментарий для",
      opSend:    "Обсудим этот код"
    }
  }[lang];
  var prompts = L.chips;

  function ts() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return "[" + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) + "]";
  }

  var logEl    = document.getElementById("log");
  var emptyEl  = document.getElementById("empty");
  var footerEl = document.getElementById("footer");
  var modeEl   = document.getElementById("mode");
  var streamRows = {};                              // requestId → DOM row
  var currentMode = "chat";                          // chat | agent | plan
  var modes = ["chat", "agent", "plan"];

  function setMode(m) {
    currentMode = m;
    modeEl.textContent = m;
    modeEl.classList.remove("plan", "agent");
    if (m === "plan")  modeEl.classList.add("plan");
    if (m === "agent") modeEl.classList.add("agent");
  }
  modeEl.addEventListener("click", function () {
    var i = modes.indexOf(currentMode);
    setMode(modes[(i + 1) % modes.length]);
  });

  function showEmpty(show) { emptyEl.hidden = !show; logEl.hidden = !!show; }

  function append(text, cls) {
    var div = document.createElement("div");
    div.className = "row" + (cls ? " " + cls : "");
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    showEmpty(false);
    return div;
  }

  // chat.delta / chat.end / error envelope routing. Falls back to a
  // raw render when the inbound JSON doesn't match the known shapes
  // (e.g. plugin-private message types — this is a sample, not a
  // production bundle).
  function onHost(jsonString) {
    var obj;
    try { obj = JSON.parse(jsonString); }
    catch (e) { append(ts() + " [raw] " + String(jsonString), "raw"); return; }

    if (obj && obj.kind === "chat.delta" && obj.requestId) {
      var row = streamRows[obj.requestId];
      if (!row) {
        row = append(ts() + " host: ", "host stream");
        streamRows[obj.requestId] = row;
      }
      row.textContent += (obj.delta || "");
      return;
    }
    if (obj && obj.kind === "chat.end" && obj.requestId) {
      delete streamRows[obj.requestId];
      var meta = obj.meta || {};
      var tokens = (meta.tokens && (meta.tokens.in || 0) + (meta.tokens.out || 0)) || 0;
      var model  = meta.model || "";
      var bits = [];
      if (tokens) bits.push(tokens + " tokens");
      if (model)  bits.push(model);
      footerEl.textContent = bits.join(" · ");
      return;
    }
    if (obj && obj.kind === "error") {
      var err = obj.error || {};
      // Permission-denied is a refusal — amber callout, not red.
      var isRefusal = (err.code === "permission_denied");
      var msg = err.detail || err.code || JSON.stringify(err);
      append(ts() + " " + msg, isRefusal ? "refusal" : "err");
      delete streamRows[obj.requestId];
      return;
    }
    if (obj && obj.kind === "agent.plan") {
      renderPlan(obj);
      return;
    }
    if (obj && obj.kind === "agent.applied") {
      renderApplied(obj);
      return;
    }
    // Editor right-click skill envelope — the editor pushes this in via
    // WebPaneSend so the user can see WHAT they asked for. Render as an
    // outgoing message + bounce a chat.send back to the plugin so the
    // round-trip uses the same path as a manual input.
    if (obj && obj.kind === "editor.skill") {
      var op = obj.op || "send";
      var labelMap = {
        explain: (L.opExplain || "Explain code"),
        review:  (L.opReview  || "Review code"),
        fix:     (L.opFix     || "Fix code"),
        doc:     (L.opDoc     || "Write a doc comment"),
        send:    (L.opSend    || "Discuss code")
      };
      var langTag = obj.language ? obj.language : "ces";
      var heading = labelMap[op] || op;
      append(ts() + " you: " + heading + "  ```" + langTag + "\n" +
             (obj.code || "") + "\n```", "user");
      // Forward as chat.send. requestId comes back from the host inside
      // chat.delta / chat.end so we can stitch the reply into a row.
      var rid = "skill-" + Date.now().toString(36) + "-"
                + Math.random().toString(36).slice(2, 8);
      var prompt = heading + ":\n\n```" + langTag + "\n" +
                   (obj.code || "") + "\n```";
      sendRaw({ kind: "chat.send", requestId: rid, text: prompt,
                  locale: (navigator.language || "uk-UA"), mode: currentMode });
      return;
    }

    // Plugin's own message types (smoke test): show as text.
    var body = (obj && typeof obj.text === "string") ? obj.text : JSON.stringify(obj);
    append(ts() + " host: " + body, "host");
  }

  function renderPlan(obj) {
    var div = document.createElement("div");
    div.className = "row plan";
    var t = document.createElement("div");
    t.className = "title";
    t.textContent = "Agent plan: " + (obj.rationale || "");
    div.appendChild(t);
    var m = document.createElement("div");
    m.className = "mutations";
    var lines = (obj.mutations || []).map(function (mu) {
      var parts = [mu.op || "?", mu.kind || "", mu.fullName || ""];
      return "  " + parts.filter(Boolean).join(" ");
    }).join("\n");
    m.textContent = lines;
    div.appendChild(m);
    var actions = document.createElement("div");
    actions.className = "actions";
    var ok = document.createElement("button");
    ok.className = "approve";
    ok.textContent = "Approve";
    ok.addEventListener("click", function () {
      sendRaw({ kind: "agent.approve", planId: obj.planId,
                 conversationId: obj.conversationId });
      div.remove();
    });
    var no = document.createElement("button");
    no.className = "reject";
    no.textContent = "Reject";
    no.addEventListener("click", function () {
      sendRaw({ kind: "agent.reject", planId: obj.planId,
                 conversationId: obj.conversationId });
      div.remove();
    });
    actions.appendChild(ok); actions.appendChild(no);
    div.appendChild(actions);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    showEmpty(false);
  }

  function renderApplied(obj) {
    var div = document.createElement("div");
    div.className = "row applied";
    var label = document.createElement("span");
    label.textContent = (obj.ok === false)
      ? ("✗ " + (obj.error || "mutation failed"))
      : ("✓ Mutation " + (obj.mutationIndex !== undefined ? "#" + obj.mutationIndex : "applied"));
    div.appendChild(label);
    if (obj.ok !== false) {
      var undo = document.createElement("button");
      undo.className = "undo";
      undo.textContent = "Undo";
      undo.addEventListener("click", function () {
        sendRaw({ kind: "agent.undo", planId: obj.planId });
      });
      div.appendChild(undo);
    }
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    showEmpty(false);
  }

  function sendRaw(obj) {
    if (window.oesHost && typeof window.oesHost.postMessage === "function") {
      try {
        window.oesHost.postMessage(JSON.stringify(obj));
      } catch (e) {
        append(ts() + " [ERR] postMessage threw: " + e, "err");
      }
    }
  }

  // Slash-command vocabulary. Maps the typed prefix to an editor.skill
  // envelope op, mirroring the right-click submenu in Phase 6.1.
  var slashOps = {
    "/explain": "explain",
    "/review":  "review",
    "/fix":     "fix",
    "/doc":     "doc",
  };

  function send(text) {
    var input = document.getElementById("input");
    text = text || input.value;
    if (!text) return;
    input.value = "";
    append(ts() + " you: " + text, "you");

    // Slash command interception — first token routes to editor.skill
    // envelope instead of chat.send. Mirrors the 1c-ai-dev-kit /skill
    // invocation pattern. Remainder of the line (if any) becomes the
    // extra prompt context. The host's editor.skill handler currently
    // ships in Phase 6.1; the plugin's onMessage picks it up.
    var firstSpace = text.indexOf(" ");
    var head = (firstSpace === -1 ? text : text.substring(0, firstSpace)).toLowerCase();
    if (slashOps[head]) {
      sendRaw({
        kind: "editor.skill",
        op:   slashOps[head],
        prompt: (firstSpace === -1 ? "" : text.substring(firstSpace + 1)),
        ts:   Date.now()
      });
      return;
    }

    if (window.oesHost && typeof window.oesHost.postMessage === "function") {
      try {
        var rid = "chat-" + Date.now().toString(36) + "-"
                  + Math.random().toString(36).slice(2, 8);
        window.oesHost.postMessage(JSON.stringify({
          kind: "chat.send",
          requestId: rid,
          mode: currentMode,
          text: text,           // shim reads "text" first
          prompt: text,         // legacy v3 shim fallback
          locale: (navigator.language || "uk-UA"),
          ts: Date.now()
        }));
      } catch (e) {
        append(ts() + " [ERR] postMessage threw: " + e, "err");
      }
    } else {
      append(ts() + " " + L.noChannel, "err");
    }
  }

  function renderPromptChips() {
    var box = document.getElementById("chips");
    for (var i = 0; i < prompts.length; i++) {
      (function (p) {
        var c = document.createElement("div");
        c.className = "chip";
        c.textContent = p;
        c.addEventListener("click", function () { send(p); });
        box.appendChild(c);
      })(prompts[i]);
    }
  }

  document.addEventListener("DOMContentLoaded", function () {
    // Apply locale strings.
    document.getElementById("title").textContent      = L.title;
    document.getElementById("emptyLabel").textContent = L.empty;
    document.getElementById("input").placeholder      = L.ask;
    document.getElementById("send").textContent       = L.send;
    document.title                                     = L.title;

    renderPromptChips();
    showEmpty(true);

    document.getElementById("send").addEventListener("click", function () { send(); });
    document.getElementById("input").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    });

    if (window.oesHost) {
      window.oesHost._recv = onHost;
      var inbox = window.oesHost.__inbox;
      if (inbox && inbox.length) {
        for (var i = 0; i < inbox.length; i++) { onHost(inbox[i]); }
        window.oesHost.__inbox = [];
      }
    }
    footerEl.textContent = "channel=" + (window.oesHost ? "wired" : "missing");
  });
})();
</script>
</body>
</html>
