// Subsystem navigation — sidebar's Interfaces block. Mirrors desktop's
// ibSubSystemWindow: a row of buttons (one per interface). Click opens
// a popup with command sections (Default / Create / Combined / Reports
// / Service); each section lists assigned metadata items. Click an
// item → /open-meta (same path as "All functions" double-click).
async function loadInterfaces(){
  const root = document.getElementById('interfaces');
  if (!root) return;
  let data;
  try {
    const r = await netFetch(API+'/interfaces',{credentials:'same-origin'});
    if (!r.ok) return;
    data = await r.json();
  } catch (e) { return; }
  const ifaces = (data && data.interfaces) || [];
  root.innerHTML = '';
  if (ifaces.length === 0) {
    root.classList.add('hidden');
    return;
  }
  root.classList.remove('hidden');
  const header = document.createElement('h3');
  header.textContent = 'Sections';
  root.appendChild(header);
  for (const iface of ifaces) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'iface-btn';
    if (iface.icon){
      const ic = document.createElement('img');
      ic.className = 'iface-icon'; ic.src = iface.icon; ic.alt = '';
      btn.appendChild(ic);
    }
    const cap = document.createElement('span');
    cap.textContent = iface.synonym || iface.name || '#'+iface.id;
    btn.appendChild(cap);
    btn.onclick = () => showInterfacePopup(iface);
    root.appendChild(btn);
  }
}

// Popup with command sections + items for a single interface. Renders
// via OES.showDialog (draggable, dismissible). Click an item → POST
// /open-meta, refresh active host + tabs, close popup.
function showInterfacePopup(iface){
  const body = document.createElement('div');
  body.style.cssText = 'min-width:380px';
  const sections = iface.sections || [];
  if (sections.length === 0) {
    const p = document.createElement('div');
    p.style.cssText = 'color:#888;padding:8px';
    p.textContent = 'No items in this section.';
    body.appendChild(p);
  }
  for (const sec of sections) {
    const det = document.createElement('details');
    det.open = (sec.section === 100);
    det.style.cssText = 'margin:2px 0';
    const sum = document.createElement('summary');
    sum.style.cssText = 'font-weight:600;color:#3b50a0;cursor:pointer;'
      + 'padding:4px 0;display:flex;align-items:center;gap:6px;'
      + 'list-style:none;user-select:none';
    const marker = document.createElement('span');
    marker.style.cssText = 'width:10px;font-size:.8em;color:#888';
    marker.textContent = det.open ? '▾' : '▸';
    det.addEventListener('toggle', () => { marker.textContent = det.open ? '▾' : '▸'; });
    sum.appendChild(marker);
    const cap = document.createElement('span');
    cap.textContent = sec.name || '';
    sum.appendChild(cap);
    det.appendChild(sum);
    for (const it of (sec.items || [])) {
      const row = document.createElement('div');
      row.style.cssText = 'padding:3px 8px 3px 28px;cursor:pointer;'
        + 'border-radius:3px;display:flex;align-items:center;gap:6px';
      row.onmouseenter = () => row.style.background = '#eef2f7';
      row.onmouseleave = () => row.style.background = '';
      if (it.icon){
        const ic = document.createElement('img');
        ic.src = it.icon; ic.alt = '';
        ic.style.cssText = 'width:16px;height:16px;flex-shrink:0';
        row.appendChild(ic);
      }
      const lbl = document.createElement('span');
      lbl.textContent = it.synonym || it.name || '#'+it.id;
      row.appendChild(lbl);
      row.onclick = async () => {
        try {
          // sec.section is the raw ibInterfaceCommandType: 100=Default
          // (browse/list), 150=Create (new-record form), 151=List, 152=
          // Select. Backend's Execute branches on it.
          const body = new URLSearchParams({cmd: String(sec.section|0)});
          await paintFrom(API+'/open-meta/'+it.id, {
            method:'POST', headers:FORM_HEADERS, body: body.toString()
          });
          refreshTabs();
        } catch (e) { /* ignore */ }
        handle.close();
      };
      det.appendChild(row);
    }
    body.appendChild(det);
  }
  const handle = OES.showDialog({
    title: iface.synonym || iface.name || '',
    body:  body,
    buttons: [{label:L.close, onClick:(d)=>d.close()}]
  });
}
// A request that answers with a form tree. Every road that gets one back — a
// button, a commit, a tab switch, a cell — used to spell the same four lines.
// requestTree returns the tree, or null when the request failed or the answer
// was an error (which it has already shown). paintFrom paints it as well and
// returns what paintTree returned: true when something was painted, false for
// an empty answer, null when there was nothing to paint.
const FORM_HEADERS={'Content-Type':'application/x-www-form-urlencoded'};
async function requestTree(url,opts){
  const r=await netFetch(url,Object.assign({credentials:'same-origin'},opts||{}));
  if(!r.ok) return null;
  const tree=await r.json();
  if(tree&&tree.error){ OES.handleBackendError(tree); return null; }
  return tree;
}
// An empty answer is a session with no active host: the form closed with
// nothing behind it, so the content area is blanked and any picker taken down
// rather than left showing a dead form. A road on which `{}` means "refused"
// instead — a cell the server would not take — says so with `refusable`, and
// gets false with nothing touched.
async function paintFrom(url,opts,refusable){
  const tree=await requestTree(url,opts);
  if(tree===null) return null;
  if(Object.keys(tree).length===0){
    if(!refusable){ closeModalForm(); hideMounts(); }
    return false;
  }
  return paintTree(tree);
}

// Per-type control classes. Each owns render(node) -> HTMLElement, and the two
// calls the reconciler makes on an element it already has: update(el, node,
// prev) brings it up to date in place and answers false when it cannot, and
// dispose(el) lets go of whatever the element holds outside the DOM (a grid
// instance). The registry at the bottom maps ibWebWindow::GetControlType()
// strings to the class that knows how to draw them.

// Properties every node may carry and that the reconciler handles itself:
// children, layout, the sequence number, and what applyCommon sets. The
// default update leaves them out of its comparison, so a change to one of them
// never forces a rebuild. A tablebox's `commandbar` is not here: only the
// tablebox has one, and it reconciles it itself.
const COMMON_KEYS=new Set(['children','layout','seq','enabled','shown','fg','bg',
  'font','tooltip','minSize','maxSize']);

function deepEqual(a,b){
  if(a===b) return true;
  if(typeof a!=='object'||typeof b!=='object'||a===null||b===null) return false;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  const ka=Object.keys(a), kb=Object.keys(b);
  if(ka.length!==kb.length) return false;
  for(const k of ka) if(!deepEqual(a[k],b[k])) return false;
  return true;
}
// A node's own properties: everything the reconciler does not handle itself.
function ownProps(node){
  const out={};
  for(const k in node) if(!COMMON_KEYS.has(k)) out[k]=node[k];
  return out;
}

class BaseControl{
  render(node){
    const el=document.createElement('div');
    el.style.cssText='border:1px dashed #ccc;padding:4px;margin:2px 0;font-size:.85em;color:#888';
    el.textContent='['+node.type+']';
    return el;
  }
  // The element stands as long as the node's own properties have not moved;
  // classes that can do better override this and change the element instead.
  update(el,node,prev){ return deepEqual(ownProps(node),ownProps(prev)); }
  dispose(el){}
  // Applied by the reconciler to every element, on every pass: shown / enabled
  // plus the visual-style fields pushed from ibValueWindow::UpdateWindow
  // (fg / bg / font / tooltip / sizes). Everything it can set it also resets,
  // so a property that went away goes away here too.
  applyCommon(el,node){
    el.style.display=node.shown===false?'none':'';
    const off=node.enabled===false;
    if('disabled' in el){
      // A native control carries the flag itself. oesOwnDisabled is a reason of
      // the renderer's own (a side button the server switched off) and holds
      // whatever the node says.
      el.disabled=off||el.oesOwnDisabled===true;
    } else {
      // A wrapper (a text field's row, a grid's host) dims as a whole, and the
      // interactive controls that are its own take the flag: those with no
      // managed element between them and it. A control under a managed child
      // (a field on a notebook page, a tool on a grid's bar) is that child's
      // to set, whichever of the two is reconciled first; a grid's own inputs
      // (oesForeign) are nobody's.
      el.style.opacity=off?'.5':'';
      el.style.pointerEvents=off?'none':'';
      for(const c of el.querySelectorAll('input,button,select,textarea')){
        if(c.oesKey!==undefined) continue;
        let own=true;
        for(let p=c.parentElement; p && p!==el; p=p.parentElement)
          if(p.oesKey!==undefined || p.oesForeign){ own=false; break; }
        if(own) c.disabled=off||c.oesOwnDisabled===true;
      }
    }
    // A control that renders as a label PLUS a field returns the row as its
    // element, and the row is not what the colour was set on: the field is.
    // A renderer that has an inner surface names it.
    const look=el.oesLookTarget||el;
    look.style.color=node.fg||'';
    look.style.backgroundColor=node.bg||'';
    const font=node.font||{};
    el.style.fontSize=font.size?font.size+'pt':'';
    // The stored family is a Windows-era name for "the UI font" — Segoe UI,
    // which no Mac or Linux box has. Named alone it matches nothing and the
    // browser falls back to a serif; the theme's own font stands behind it.
    el.style.fontFamily=font.family
      ?'"'+String(font.family).replace(/"/g,'')+'", var(--oes-font-ui)':'';
    el.style.fontWeight=font.bold?'bold':'';
    el.style.fontStyle=font.italic?'italic':'';
    el.style.textDecoration=font.underline?'underline':'';
    if(node.tooltip) el.title=node.tooltip; else el.removeAttribute('title');
    // A stored minimum raises a floor; it does not lower one. Written as a plain
    // value it replaced whatever the stylesheet had, and a tablebox — whose
    // class default is 150x75, chosen by nobody — came out at 75px. max() keeps
    // both, and the larger wins whichever side it came from.
    const mn=node.minSize||{}, mx=node.maxSize||{};
    el.style.minWidth =mn.w?`max(${mn.w}px, var(--oes-min-w, 0px))`:'';
    el.style.minHeight=mn.h?`max(${mn.h}px, var(--oes-min-h, 0px))`:'';
    el.style.maxWidth =mx.w?mx.w+'px':'';
    el.style.maxHeight=mx.h?mx.h+'px':'';
  }
}

// What a button or a tool shows: caption, picture, or both, by the
// representation the server resolved (0=Auto never arrives, 1=Text,
// 2=Picture, 3=PictureAndText). Compared as one string so the content is
// rebuilt only when it changed.
function captionKey(node){
  return JSON.stringify([node.representation,node.label||'',
    node.hasPicture?node.picture||'':null]);
}

class Button extends BaseControl{
  render(node){
    const el=document.createElement('button');el.className='ctrl';
    this.fill(el,node);
    if(node.id) el.onclick=()=>paintFrom(API+'/action/'+node.id,{method:'POST'});
    return el;
  }
  // Picture is a data:image/png;base64 URI straight from ibBackendPicture.
  fill(el,node){
    el.replaceChildren();
    const rep=node.representation;
    const wantPic=node.hasPicture && node.picture && rep!==1;
    const wantText=rep!==2;
    if(wantPic){
      const img=document.createElement('img');
      img.src=node.picture;img.alt='';
      img.style.cssText='height:1em;vertical-align:middle;'+(wantText?'margin-right:4px;':'');
      el.appendChild(img);
    }
    if(wantText) el.appendChild(document.createTextNode(node.label||''));
    el.oesCaption=captionKey(node);
  }
  update(el,node){
    if(el.oesCaption!==captionKey(node)) this.fill(el,node);
    return true;
  }
}

class TextCtrl extends BaseControl{
  render(node){
    const multi=!!node.multilineMode;
    // Outer row: label (prefix) + input group (input + side buttons sharing one
    // border). Matches desktop ibControlTextEditor, where the caption sits left
    // of the frame and the Select/Open/Clear glyphs sit inside it, flush right.
    const wrap=document.createElement('div');
    // .labelrow is the flex row; data-labelrow is the hook for the label-width
    // alignment pass (alignLabelsGlobal). An empty placeholder span still takes
    // part in the measurement so sibling inputs start at the same x, the way
    // ibVisualHost::CalculateLabelSize reserves a slot for every caption.
    wrap.className='labelrow';
    wrap.dataset.labelrow='1';
    const lbl=document.createElement('span');
    lbl.className='statictext';
    lbl.dataset.labelHost='1';
    lbl.style.flexShrink='0';
    lbl.style.alignSelf='center';
    wrap.appendChild(lbl);
    const group=document.createElement('div');
    group.className='texted';
    if(node.id) group.dataset.ctrlId=node.id;
    // The input group is the surface the colours were set on, not the row that
    // carries the label beside it.
    wrap.oesLookTarget=group;
    const el=document.createElement(multi?'textarea':'input');
    if(!multi) el.type=node.passwordMode?'password':'text';
    el.value=node.value||'';
    wrap.oesLabel=lbl;
    wrap.oesInput=el;
    // What the client last wrote into the input from a server node. While the
    // input holds anything else, somebody is typing in it and the server's
    // value waits in oesPending.
    wrap.oesApplied=el.value;
    wrap.oesPending=undefined;
    // Commits not yet answered. While an older one is still out, the field is
    // treated as being typed in: its answer must not overwrite the newer text.
    wrap.oesCommits=0;
    if(node.id){
      // Commit on change (blur) and Enter, not per keystroke. The answer is
      // what the server made of the text, and it takes the input even while
      // the caret is still in it: the sent text counts as applied.
      const commit=async()=>{
        const sent=el.value;
        wrap.oesApplied=sent;
        wrap.oesPending=undefined;
        wrap.oesCommits++;
        try{
          return await paintFrom(API+'/change/'+node.id,{method:'POST',headers:FORM_HEADERS,
            body:new URLSearchParams({value:sent}).toString()});
        } finally { wrap.oesCommits--; }
      };
      el.addEventListener('change',commit);
      if(!multi){
        el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); commit(); } });
      }
    }
    // A value the server sent while the field was being typed in lands when
    // the field is left with no net change — the case no change event covers.
    el.addEventListener('blur',()=>{
      if(wrap.oesPending===undefined) return;
      if(el.value===wrap.oesApplied){ el.value=wrap.oesPending; wrap.oesApplied=el.value; }
      wrap.oesPending=undefined;
    });
    group.appendChild(el);
    // Desktop ibControlTextEditor side buttons: Select (…), Open (▷), Clear (×),
    // inside the group's border. Each click fires /fire/<id>/<kind> →
    // ibWebTextCtrl::HandleRequest → FireCommand → the control's handler. All
    // three exist and show or hide by the node, so a change to the set is not
    // a rebuild.
    wrap.oesButtons={};
    const makeSideBtn=(label,kind,title)=>{
      const btn=document.createElement('button');
      btn.type='button';
      btn.textContent=label;
      btn.title=title;
      // Keep the focus where it is: a blur here would fire the input's change
      // and POST /change beside the /fire, and the two would race for one value.
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.onclick=async()=>{
        // The button acts on the field as it stands; text typed and not yet
        // committed is let go, so the answer's value is written whatever the
        // input holds.
        wrap.oesApplied=el.value;
        wrap.oesPending=undefined;
        const painted=await paintFrom(API+'/fire/'+node.id+'/'+kind,{method:'POST'});
        // Clear puts the caret at the start of the (now empty) field, as
        // ibControlTextEditor::SetInsertionPoint(wxNOT_FOUND) does.
        if(painted && kind==='buttonClear'){
          el.focus({preventScroll:true});
          try{ el.setSelectionRange(0,0); }catch(_){ }
        }
        // Select and Open can raise a form of their own (a picker, the related
        // record), so the tab strip is re-read at once rather than on the next
        // poll tick.
        if(kind==='buttonSelect'||kind==='buttonOpen') refreshTabs();
      };
      group.appendChild(btn);
      wrap.oesButtons[kind]=btn;
    };
    if(node.id){
      makeSideBtn('…','buttonSelect','Select');
      makeSideBtn('▷','buttonOpen','Open');
      makeSideBtn('×','buttonClear','Clear');
    }
    wrap.appendChild(group);
    this.sync(wrap,node);
    return wrap;
  }
  sync(wrap,node){
    wrap.oesLabel.textContent=node.label||'';
    wrap.oesInput.readOnly=!!node.readOnly;
    const b=wrap.oesButtons;
    if(b.buttonSelect){
      b.buttonSelect.hidden=!node.showSelectButton;
      b.buttonOpen.hidden=!node.showOpenButton;
      b.buttonClear.hidden=!node.showClearButton;
      b.buttonSelect.oesOwnDisabled=node.enableSelectButton===false;
      b.buttonClear.oesOwnDisabled=node.enableClearButton===false;
    }
  }
  update(wrap,node,prev){
    // The element kind and the input type are decided at creation.
    if(!!node.multilineMode!==!!prev.multilineMode) return false;
    if(!!node.passwordMode!==!!prev.passwordMode) return false;
    this.sync(wrap,node);
    // Typing wins over the server. The value is written while nobody is in the
    // field, or while the field still shows what the client last wrote there
    // and no older commit is still unanswered; otherwise it waits for the blur.
    const el=wrap.oesInput, v=node.value||'';
    const focused=document.activeElement===el;
    if(!focused || (el.value===wrap.oesApplied && wrap.oesCommits<=1)){
      if(el.value!==v){
        // The server's reformatted text lands under the caret, not after it.
        let start=null, end=null;
        if(focused){ try{ start=el.selectionStart; end=el.selectionEnd; }catch(_){} }
        el.value=v;
        if(start!==null){ try{ el.setSelectionRange(Math.min(start,v.length),Math.min(end,v.length)); }catch(_){} }
      }
      wrap.oesApplied=v;
      wrap.oesPending=undefined;
    } else {
      wrap.oesPending=v;
    }
    return true;
  }
}

class Toolbar extends BaseControl{
  // Container. The children render themselves (Tool / ToolSeparator); the
  // toolbar's job is just to lay them out horizontally on a strip.
  render(){ const el=document.createElement('div');el.className='toolbar';return el; }
}

// A tool activates one of two things, and which one it is the node says.
// A tool on the form's own command bar names a COMMAND by action id and
// carries no control id — the bar is chrome, so the control dispatcher
// cannot reach it and the click goes to /command. Everything else is a
// control action. Both answers are the form again.
function toolRoad(node){
  return node.action!==undefined ? API+'/command/'+node.action
       : node.id                 ? API+'/action/'+node.id
       : null;
}
function bindToolActivation(el, node){
  const road=toolRoad(node);
  if(road===null) return;
  // Whose bar. Action ids are unique within a bar and not across bars, so a
  // table's "Add" and the form's are the same number; `owner` is what tells
  // the server which one was clicked. Absent means the form's own.
  const opts={method:'POST'};
  if(node.owner){
    opts.headers=FORM_HEADERS;
    opts.body=new URLSearchParams({owner:String(node.owner)}).toString();
  }
  el.addEventListener('click', async()=>{
    await paintFrom(road,opts);
    // A tool can close / open / switch forms (ActionClose, a script that calls
    // OpenForm), so the strip is re-read rather than waited for: the dying tab
    // goes now instead of on the next poll tick.
    refreshTabs();
  });
}

class Tool extends BaseControl{
  render(node){
    const el=document.createElement('button');el.className='tool';
    el.type='button';
    this.fill(el,node);
    bindToolActivation(el, node);
    return el;
  }
  // node.picture, when present, is a data:image/png;base64 URI produced by
  // ibBackendPicture::CreateBase64Image; hasPicture without data falls back
  // to a CSS block.
  fill(el,node){
    el.replaceChildren();
    const rep = node.representation|0;
    const showIcon = (rep === 2 || rep === 3) && !!node.hasPicture;
    const showText = !!node.label && (rep === 1 || rep === 3);
    el.classList.toggle('tool-picture-only', rep === 2 && !!node.hasPicture);
    if (showIcon) {
      const ic = document.createElement(node.picture ? 'img' : 'span');
      ic.className = 'tool-icon';
      if (node.picture) { ic.src = node.picture; ic.alt = node.label || ''; }
      el.appendChild(ic);
    }
    if (showText) {
      const lbl = document.createElement('span');
      lbl.textContent = node.label;
      el.appendChild(lbl);
    }
    el.oesCaption=captionKey(node);
  }
  update(el,node,prev){
    // The click handler was bound to a road and an owner; a different one is a
    // different tool.
    if(toolRoad(node)!==toolRoad(prev) || node.owner!==prev.owner) return false;
    if(el.oesCaption!==captionKey(node)) this.fill(el,node);
    return true;
  }
}

class ToolSeparator extends BaseControl{
  render(){ const el=document.createElement('span');el.className='toolseparator';return el; }
  update(){ return true; }
}

class CheckBox extends BaseControl{
  render(node){
    const wrap=document.createElement('label');wrap.className='ctrl checkbox';
    const el=document.createElement('input');el.type='checkbox';
    if(node.id){
      el.addEventListener('change',()=>paintFrom(API+'/toggle/'+node.id,{method:'POST',
        headers:FORM_HEADERS,body:new URLSearchParams({checked:el.checked?'1':'0'}).toString()}));
    }
    wrap.appendChild(el);
    const s=document.createElement('span');
    wrap.appendChild(s);
    wrap.oesInput=el; wrap.oesText=s;
    this.update(wrap,node,{});
    return wrap;
  }
  update(wrap,node){
    wrap.oesInput.checked=!!node.value;
    wrap.oesText.textContent=node.label?' '+node.label:'';
    return true;
  }
}

// ---------------------------------------------------------------------------
// TableBox — the one grid engine (ADR-003).
//
// Two roads meet here. The shape (columns, captions, widths, value
// types) arrives in the form JSON, pushed by the controls themselves.
// The rows arrive on their own, one page per request, from
// GET /fetch/<id> — a list is paged in the engine by architecture, and
// pretending otherwise on the way to the browser would only mean
// reading a whole catalogue to draw twenty lines of it.
//
// Row keys are minted by the server and stay valid for the life of its
// window, so a page fetched on scroll does not renumber what is already
// on screen. The client never invents one.
//
// The tree carries no rows, so it says when they moved instead: `dataVersion`
// is the model's view generation. A grid whose columns are unchanged keeps its
// instance across answers and re-reads its rows when that number moves.
// ---------------------------------------------------------------------------

// 700 KB of grid arrives only when a form actually has a table on it.
let tabulatorPromise=null;
function loadTabulator(){
  if(tabulatorPromise) return tabulatorPromise;
  tabulatorPromise=(async()=>{
    const link=document.createElement('link');
    link.rel='stylesheet';
    link.href=new URL('./assets/tabulator/6.5.2/tabulator.css',document.baseURI).href;
    const styled=new Promise(done=>{
      link.addEventListener('load',done);
      link.addEventListener('error',done);
    });
    document.head.appendChild(link);
    const mod=await import('tabulator-tables');
    await styled;
    return mod.TabulatorFull;
  })();
  return tabulatorPromise;
}

// The server keeps at most this many rows in a window; a re-read never asks
// for more.
const TABLEBOX_WINDOW_CAP=5000;

// The cell's own editor: the text, plus the buttons the column declares — Select
// (…), Open (▷), Clear (×). The same three a form field carries, read from the
// same three properties, which is why a number column shows them too: the
// desktop's inline editor reads exactly these and shows exactly these.
//
// A button is the act, not the text beside it: the edit is cancelled first, so
// the editor's own commit road and the button's cannot both reach the same line.
// Then the cursor moves to the row and the kind goes to the COLUMN — the shape
// every cell request has.
function oesCellEditor(tableId,columnId,buttons){
  return function(cell,onRendered,success,cancel){
    let settled=false;
    const group=document.createElement('div');
    group.className='oes-cell-editor';
    const input=document.createElement('input');
    input.type='text';
    input.value=cell.getValue()??'';
    group.appendChild(input);
    onRendered(()=>{ input.focus(); input.select(); });
    const commit=()=>{ if(settled) return; settled=true; success(input.value); };
    input.addEventListener('blur',commit);
    input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); commit(); }
      else if(e.key==='Escape'){ e.preventDefault(); settled=true; cancel(); }
    });
    const key=cell.getRow().getData()._key;
    for(const [glyph,kind,title] of buttons){
      const btn=document.createElement('button');
      btn.type='button'; btn.textContent=glyph; btn.title=title;
      // Keep the focus where it is: a blur here commits the cell through the
      // editor's own road at the same moment the button takes its own, and the
      // two would race for one line.
      btn.addEventListener('mousedown',e=>e.preventDefault());
      btn.addEventListener('click',async()=>{
        settled=true; cancel();
        const moved=await netFetch(API+'/fire/'+tableId+'/row?value='+encodeURIComponent(key),
          {method:'POST',credentials:'same-origin'});
        if(!moved.ok) return;
        const painted=await paintFrom(API+'/fire/'+columnId+'/'+kind,{method:'POST'},true);
        if(!painted) return;
        // Select and Open can raise a form of their own — a picker, the
        // referenced object — so the tab strip is re-read at once.
        if(kind!=='cellClear') refreshTabs();
      });
      group.appendChild(btn);
    }
    return group;
  };
}

// Columns, in the order the header draws them. A group is transparent
// unless it is a HORIZONTAL group with a title, which is the one kind
// Tabulator also has: its columns sit side by side under one caption.
// OES vertical and in-cell groups are a row BAND — the row grows taller
// instead of wider — which Tabulator has no notion of, so those flatten
// here and their columns stay side by side. See docs-web/web/tablebox.md.
// Returns the column definitions, and fills `sortableBy` (field -> the
// column control's id) as it goes. The field is unique per column, so it
// is the join; a private key on the definition itself would be validated
// against Tabulator's own option list and warned about by name.
function tableboxColumns(node,sortableBy,editableBy,tableId){
  const out=[];
  for(const kid of (node.children||[])){
    if(kid.type==='tableboxcolumngroup'){
      if(kid.visible===false) continue;
      const inner=tableboxColumns(kid,sortableBy,editableBy,tableId);
      if(!inner.length) continue;
      if(kid.showTitle&&kid.grouping==='horizontal')
        out.push({title:kid.caption||'',headerHozAlign:kid.align||'center',columns:inner});
      else out.push(...inner);
      continue;
    }
    if(kid.type!=='tableboxcolumn'||kid.visible===false) continue;
    const arrow=kid.sortOrder==='asc'?' ▲':kid.sortOrder==='desc'?' ▼':'';
    const col={
      title:(kid.caption||'')+arrow,
      field:kid.field,
      hozAlign:kid.align||'left',
      headerHozAlign:kid.headerAlign||'left',
      resizable:kid.resizable!==false,
      // The stored width is what the column asks for; the surplus is
      // shared, so a table fills the space the form gave it instead of
      // leaving a bare strip on the right — which is what the desktop
      // grid does with the same numbers.
      widthGrow:1,
      // Tabulator's own sort is never used: it would reorder the page in
      // hand and call that a sorted list. A header click goes to the
      // server, which commits an ORDER BY to the composer and reads the
      // list again from the top.
      headerSort:false,
    };
    if(sortableBy&&kid.sortable) sortableBy.set(kid.field,kid.id);
    // An editable column gets a plain text editor whatever it holds. The
    // server coerces the typed string through the type the cell already has
    // — a number, a date, a reference found by its name — which is the same
    // road the desktop's inline editor takes, so there is one parser and not
    // one per value type in the browser.
    if(editableBy&&kid.readOnly===false){
      editableBy.set(kid.field,kid.id);
      const buttons=[];
      if(kid.showSelectButton) buttons.push(['…','cellSelect','Select']);
      if(kid.showOpenButton)   buttons.push(['▷','cellOpen','Open']);
      if(kid.showClearButton)  buttons.push(['×','cellClear','Clear']);
      col.editor=buttons.length?oesCellEditor(tableId,kid.id,buttons):'input';
    }
    if(kid.width>0) col.minWidth=kid.width;
    out.push(col);
  }
  return out;
}

function tableboxRows(payload){
  return (payload.rows||[]).map(r=>Object.assign(
    {_key:r.key,_container:!!r.container,_group:r.group||''}, r.cells||{}));
}

// Everything that decides how the grid is built: the columns (caption, arrow,
// width, editor) and the table's own options. A different shape is a different
// grid; the data version and the command bar are not part of it.
function tableboxShape(node){
  const own=ownProps(node);
  delete own.dataVersion;
  delete own.commandbar;
  own.children=node.children||[];
  return JSON.stringify(own);
}

class TableBox extends BaseControl{
  get ownsChildren(){ return true; }
  render(node){
    const host=document.createElement('div');
    host.className='oes-tablebox';
    host.dataset.ctrlId=node.id;
    host.oesShape=tableboxShape(node);
    host.oesBar=null;
    host.oesGrid=null;

    const grid=document.createElement('div');
    grid.className='oes-tablebox-grid';
    // What Tabulator draws inside is its own; applyCommon leaves it alone.
    grid.oesForeign=true;
    host.appendChild(grid);
    this.syncBar(host,node);

    const sortableBy=new Map();
    const editableBy=new Map();
    const columns=tableboxColumns(node,sortableBy,editableBy,node.id);
    const pageSize=node.pageSize>0?node.pageSize:50;

    // Built after the host lands in the document: Tabulator measures the
    // element it is given, and a detached div measures zero.
    requestAnimationFrame(async()=>{
      if(host.oesDisposed) return;
      let Tabulator;
      try { Tabulator=await loadTabulator(); }
      catch(e){ grid.textContent='Grid engine failed to load: '+e.message; return; }
      if(host.oesDisposed) return;

      let hasMore=false;
      const table=new Tabulator(grid,{
        height:'100%',
        layout:'fitColumns',
        columns,
        data:[],
        index:'_key',
        headerVisible:node.header!==false,
        placeholder:'—',
        selectableRows:1,
        columnDefaults:{headerSort:false},
      });
      // Held from this moment, so a host disposed before the grid is built
      // still destroys it.
      host.oesTable=table;

      // The highlight is the SERVER's current row, not a memory of which
      // <tr> was clicked: every page carries currentKey when the cursor
      // is inside the window, and the grid is made to agree with it.
      const showCurrent=key=>{
        if(key===undefined||key===null) return;
        const row=table.getRow(key);
        if(!row) return;
        for(const s of table.getSelectedRows()) if(s!==row) s.deselect();
        row.select();
      };

      // One road for every page. Requests run one at a time on a single
      // chain, so a small `next` cannot land ahead of the big `first` it was
      // asked after; and every `first` opens a new generation, so an answer
      // issued under an older one — a `next` from a window the server has
      // since thrown away — is discarded rather than added onto fresh rows
      // under the same keys. A page that is queued and not yet sent is not
      // queued twice, since it reads its count when it goes; a `next` is one
      // request while it is out as well, so a scroll that fires while its
      // page is on the way asks for nothing more.
      let chain=Promise.resolve(), generation=0;
      const pending={first:false,next:false}, inflight={first:false,next:false};
      const request=(dir,howMany,apply)=>{
        if(pending[dir] || (dir==='next' && inflight[dir])) return chain;
        pending[dir]=true;
        const run=async()=>{
          pending[dir]=false;
          inflight[dir]=true;
          try{ await send(); } finally { inflight[dir]=false; }
        };
        const send=async()=>{
          if(host.oesDisposed) return;
          const gen=dir==='first'?++generation:generation;
          const count=typeof howMany==='function'?howMany():howMany;
          const r=await netFetch(API+'/fetch/'+node.id+'?dir='+dir+'&count='+count);
          if(!r.ok||host.oesDisposed||gen!==generation) return;
          const payload=await r.json();
          if(!payload.ok||host.oesDisposed||gen!==generation) return;
          await apply(payload);
          // The version the rows on screen were read at (the server reads it
          // after the page), which the next tree is compared against.
          if(typeof payload.dataVersion==='number') host.oesRowsVersion=payload.dataVersion;
          hasMore=!!payload.hasMore;
          showCurrent(payload.currentKey);
        };
        chain=chain.then(run,run).catch(e=>console.log('fetch page failed',e));
        return chain;
      };
      const fetchPage=dir=>request(dir,pageSize,async payload=>{
        const rows=tableboxRows(payload);
        if(payload.reset) await table.setData(rows);
        else if(rows.length) await table.addData(rows,false);
      });

      // The rows moved on the server (the tree's dataVersion is past the one
      // the rows were read at). Read again from the top as many rows as are
      // on screen, so the pages scrolled to are kept, and put them in place:
      // replaceData keeps the scroll position, setData would reset it. A
      // version already asked for is not asked for twice.
      const refetch=version=>{
        if(version!==undefined && host.oesRowsWanted===version) return;
        host.oesRowsWanted=version;
        request('first',()=>Math.min(TABLEBOX_WINDOW_CAP,Math.max(pageSize,table.getDataCount())),
          payload=>table.replaceData(tableboxRows(payload)))
          .finally(()=>{ if(host.oesRowsWanted===version) host.oesRowsWanted=undefined; });
      };

      table.on('tableBuilt',()=>{
        if(host.oesDisposed) return;
        host.oesGrid={table,refetch};
        fetchPage('first');
      });

      // Scroll-driven prefetch: the same shape the desktop control uses
      // (ibDataViewCtrl::OnScrollEvent asks the model for the next page
      // as the viewport approaches the end).
      table.on('scrollVertical',top=>{
        const holder=grid.querySelector('.tabulator-tableholder');
        if(!holder||!hasMore) return;
        if(top+holder.clientHeight>=holder.scrollHeight-holder.clientHeight/2)
          fetchPage('next');
      });

      // The cursor is the server's current line — the row a command runs
      // against. Selection in the grid is only how it is shown. An empty or
      // failed answer is null, and painting null paints nothing.
      const send=async(kind,key)=>{
        const r=await netFetch(API+'/fire/'+node.id+'/'+kind+'?value='+encodeURIComponent(key),
          {method:'POST',credentials:'same-origin'});
        if(!r.ok) return null;
        const tree=await r.json();
        return tree&&!tree.error&&Object.keys(tree).length>0?tree:null;
      };
      table.on('rowClick',async(e,row)=>{
        const key=row.getData()._key;
        if(key===undefined) return;
        // Mark it before the round trip. The server is what decides the
        // current row, but a click that shows nothing until the answer
        // comes back reads as a click that did not land.
        for(const s of table.getSelectedRows()) if(s!==row) s.deselect();
        row.select();
        await send('row',key);
      });
      // A header click sorts on the server. The answer is the whole form
      // again with the arrow moved on the column; the arrow is part of the
      // column shape, so the grid is rebuilt and asks for the first page of
      // the new order. The old page keys named rows in the old one.
      table.on('headerClick',async(e,column)=>{
        const id=sortableBy.get(column.getField());
        if(id===undefined) return;
        paintTree(await send('sort',id));
      });
      // A cell committed. Two posts, in this order and awaited: the cursor
      // moves to the row, then the column is told what was typed. The column
      // writes through the current line — the same rule the desktop has, where
      // a cell cannot be edited without standing on its row — so the move is a
      // precondition and not a convenience; if it fails, nothing is written.
      //
      // The answer is the whole form again: a committed cell can move anything
      // (a price recalculating an amount, a script on the column), and the row
      // that comes back is the row the server holds rather than the text that
      // was typed at it.
      table.on('cellEdited',async(cell)=>{
        const id=editableBy.get(cell.getField());
        const key=cell.getRow().getData()._key;
        if(id===undefined||key===undefined) return;
        // A refused edit puts the cell back. The server answers a form tree
        // when it took the value and nothing when it did not — a name no goods
        // answer to, a number that will not parse. Left alone, the browser
        // would go on showing text the row does not hold; the desktop's editor
        // restores the old text in exactly this case, and so does this.
        const restore=()=>{ try{ cell.restoreOldValue(); }catch(e){} };
        const moved=await netFetch(API+'/fire/'+node.id+'/row?value='+encodeURIComponent(key),
          {method:'POST',credentials:'same-origin'});
        if(!moved.ok) return restore();
        const painted=await paintFrom(API+'/fire/'+id+'/cell?value='+encodeURIComponent(cell.getValue()??''),
          {method:'POST'},true);
        if(!painted) restore();
      });
      // Opening a row raises the object's own form — a new tab, so the
      // tab strip is re-read and the returned tree is painted.
      //
      // Unless the row is EDITABLE, in which case the double click is already
      // doing its work: the first of its two clicks opened the cell's editor.
      // The same branch the desktop takes in ActivateRow, where an editable row
      // starts the editor and opens nothing.
      table.on('rowDblClick',async(e,row)=>{
        const key=row.getData()._key;
        if(key===undefined) return;
        if(editableBy.size>0&&!row.getData()._container) return;
        paintTree(await send('activate',key));
        refreshTabs();
      });
    });

    return host;
  }
  // The table's own command bar, above the grid — Add / Copy / Delete for a
  // tabular section. It arrives beside the children rather than among them,
  // because the children of a table are its columns; drawn through the
  // ordinary toolbar renderer so it looks like every other strip.
  syncBar(host,node){
    if(node.commandbar){
      const bar=reconcile(host,host.oesBar,node.commandbar,undefined,'commandbar');
      bar.classList.add('oes-tablebox-bar');
      if(host.firstChild!==bar) host.insertBefore(bar,host.firstChild);
      host.oesBar=bar;
    } else if(host.oesBar){
      disposeEl(host.oesBar);
      host.oesBar=null;
    }
  }
  update(host,node,prev){
    if(host.oesShape!==tableboxShape(node)) return false;
    this.syncBar(host,node);
    // The rows are stale when the tree's version is past the one they were
    // read at — the page answer carries that (a list over a database snapshot
    // moves the generation while it materialises its first page, so the
    // previous tree's number would say "moved" once per mutation for
    // nothing). A server that does not stamp the page leaves only the trees
    // to compare.
    if(node.dataVersion!==undefined && host.oesGrid){
      const readAt=host.oesRowsVersion;
      const moved=typeof readAt==='number' ? node.dataVersion>readAt
                                          : node.dataVersion!==prev.dataVersion;
      if(moved) host.oesGrid.refetch(node.dataVersion);
    }
    return true;
  }
  dispose(host){
    host.oesDisposed=true;
    host.oesGrid=null;
    if(host.oesTable){ try{ host.oesTable.destroy(); }catch(e){} host.oesTable=null; }
  }
}

class StaticLine extends BaseControl{
  render(node){
    const el=document.createElement('div');
    el.className='staticline '+(node.orient===WX_VERTICAL?'vert':'horz');
    return el;
  }
}

class RadioButton extends BaseControl{
  render(node){
    const wrap=document.createElement('label');wrap.className='ctrl radiobutton';
    const el=document.createElement('input');el.type='radio';
    if(node.id){
      el.addEventListener('change',()=>{
        if(!el.checked) return;
        paintFrom(API+'/fire/'+node.id+'/select',{method:'POST'});
      });
    }
    wrap.appendChild(el);
    const s=document.createElement('span');
    wrap.appendChild(s);
    wrap.oesInput=el; wrap.oesText=s;
    this.update(wrap,node,{});
    return wrap;
  }
  update(wrap,node){
    // Which buttons are one choice is not a question the page can answer: the
    // server names the group, being the side that holds the control tree.
    wrap.oesInput.name='oes-radio-'+(node.group||0);
    wrap.oesInput.checked=!!node.value;
    wrap.oesText.textContent=node.label||'';
    return true;
  }
}

class Gauge extends BaseControl{
  render(node){
    const vert=node.orient===WX_VERTICAL;
    const el=document.createElement('div');
    el.className='gauge '+(vert?'vert':'horz');
    const fill=document.createElement('div');fill.className='fill';
    el.appendChild(fill);
    el.oesFill=fill;
    el.setAttribute('role','progressbar');
    el.setAttribute('aria-valuemin','0');
    this.update(el,node,{orient:node.orient});
    return el;
  }
  update(el,node,prev){
    if(node.orient!==prev.orient) return false;
    const vert=node.orient===WX_VERTICAL;
    const range=Math.max(1,node.range|0);
    const value=Math.max(0,Math.min(range,node.value|0));
    el.oesFill.style[vert?'height':'width']=(value/range*100)+'%';
    el.setAttribute('aria-valuemax',String(range));
    el.setAttribute('aria-valuenow',String(value));
    return true;
  }
}

class Slider extends BaseControl{
  render(node){
    const el=document.createElement('input');el.type='range';
    el.className='ctrl slider'+(node.orient===WX_VERTICAL?' vert':'');
    if(node.id){
      // On release, not per pixel: the position is committed to a property on
      // the server, and a drag would post a hundred times to say one thing.
      el.addEventListener('change',()=>{
        el.oesApplied=el.value;
        paintFrom(API+'/fire/'+node.id+'/value?value='+encodeURIComponent(el.value),{method:'POST'});
      });
    }
    this.update(el,node,{orient:node.orient});
    return el;
  }
  update(el,node,prev){
    if(node.orient!==prev.orient) return false;
    el.min=String(node.min|0);
    el.max=String(node.max|0);
    // The same rule as a text field: a slider under the pointer keeps its
    // position until it is released.
    const v=String(node.value|0);
    if(document.activeElement!==el || el.value===el.oesApplied){ el.value=v; el.oesApplied=v; }
    return true;
  }
}

// A notebook draws its own children: the pages are a strip of captions plus
// ONE page, not a stack of panels. Which one is in front comes from the
// server — a page brought forward runs the form's OnPageChanged, and a
// choice the browser kept to itself would be undone by the next answer.
// A page switch reconciles the body alone: a different page id is a new
// element in place of the old, and nothing else on the form is touched.
class Notebook extends BaseControl{
  get ownsChildren(){ return true; }
  render(node){
    const el=document.createElement('div');
    // `orient` here is the OrientPage property (wxAUI_NB_TOP / _BOTTOM), which
    // is a different enum from the sizer orientation of the same field name.
    el.className='notebook';
    const strip=document.createElement('div');strip.className='nb-strip';
    const body=document.createElement('div');body.className='nb-body';
    el.appendChild(strip);
    el.appendChild(body);
    el.oesStrip=strip; el.oesBody=body; el.oesActiveId=null;
    this.update(el,node,{});
    return el;
  }
  update(el,node){
    el.classList.toggle('bottom',node.orient===WX_AUI_NB_BOTTOM);
    const pages=(node.children||[]).filter(
      kid=>kid && kid.type==='notebookpage' && kid.shown!==false);
    const active=pages.find(p=>p.id===node.active)||pages[0]||null;
    el.oesActiveId=active?active.id:null;

    // The strip: one button per visible page, kept by page id and put in page
    // order; a caption is redrawn only when it changed.
    const strip=el.oesStrip;
    const spare=new Map();
    for(const b of Array.from(strip.children)) spare.set(b.dataset.pageId,b);
    pages.forEach((page,i)=>{
      const pid=page.id!=null?String(page.id):'@'+i;
      let tab=spare.get(pid);
      if(tab) spare.delete(pid);
      else {
        tab=document.createElement('button');
        tab.type='button';tab.className='nb-tab';
        tab.dataset.pageId=pid;
        if(node.id && page.id){
          tab.onclick=()=>{
            if(page.id===el.oesActiveId) return;
            paintFrom(API+'/fire/'+node.id+'/page?value='+encodeURIComponent(page.id),{method:'POST'});
          };
        }
      }
      // Same three ways a tool reads its own caption.
      const cap=captionKey(page);
      if(tab.oesCaption!==cap){
        tab.replaceChildren();
        const rep=page.representation;
        if(page.hasPicture && page.picture && rep!==1){
          const img=document.createElement('img');
          img.src=page.picture;img.alt='';
          tab.appendChild(img);
        }
        if(rep!==2) tab.appendChild(document.createTextNode(page.label||''));
        tab.oesCaption=cap;
      }
      tab.setAttribute('aria-selected',String(page===active));
      if(strip.children[i]!==tab) strip.insertBefore(tab,strip.children[i]||null);
    });
    for(const b of spare.values()) b.remove();

    // The body: the page in front, reconciled against whatever is there.
    const body=el.oesBody;
    const current=body.firstElementChild;
    if(active) reconcile(body,current,active,undefined,nodeKey(active,0));
    else if(current) disposeEl(current);
    return true;
  }
}

class NotebookPage extends BaseControl{
  render(){
    const el=document.createElement('div');el.className='notebookpage';
    return el;
  }
  // The caption is the strip's business; the page itself is a box.
  update(){ return true; }
}

class HtmlBox extends BaseControl{
  render(node){
    const el=document.createElement('div');el.className='htmlbox';
    const frame=document.createElement('iframe');
    // The markup is the application's, and it stays in its own frame: no
    // scripts, no origin, nothing it can reach in the page around it.
    frame.setAttribute('sandbox','');
    frame.title=node.label||'';
    frame.srcdoc=node.page||'';
    el.appendChild(frame);
    el.oesFrame=frame;
    return el;
  }
  update(el,node,prev){
    el.oesFrame.title=node.label||'';
    // Setting srcdoc reloads the frame, so only a page that changed is set.
    if((node.page||'')!==(prev.page||'')) el.oesFrame.srcdoc=node.page||'';
    return true;
  }
}

const renderers={
  'visualHost':    new HostControl(),
  'mdiChild':      new HostControl(),
  'boxsizer':      new BoxSizer(),
  'wrapsizer':     new WrapSizer(),
  'staticboxsizer':new StaticBoxSizer(),
  'gridsizer':     new GridSizer(),
  'statictext':    new StaticText(),
  'button':        new Button(),
  'textctrl':      new TextCtrl(),
  'checkbox':      new CheckBox(),
  'toolbar':       new Toolbar(),
  'tool':          new Tool(),
  'toolseparator': new ToolSeparator(),
  'tablebox':      new TableBox(),
  'staticline':    new StaticLine(),
  'radiobutton':   new RadioButton(),
  'gauge':         new Gauge(),
  'slider':        new Slider(),
  'notebook':      new Notebook(),
  'notebookpage':  new NotebookPage(),
  'htmlbox':       new HtmlBox(),
};
const fallback=new BaseControl();

// wx layout flag constants (match wx/defs.h) — used to turn each
// child's "layout": {proportion, flag, border} hint into CSS on its
// flex container. proportion -> flex-grow, wxEXPAND -> flex-grow=1,
// wxLEFT/RIGHT/UP/DOWN + border -> per-side margin, wxALIGN_* ->
// align-self on the main/cross axis.
const WX_LEFT=0x0010, WX_RIGHT=0x0020, WX_TOP=0x0040, WX_BOTTOM=0x0080;
const WX_ALIGN_RIGHT=0x0200, WX_ALIGN_CENTER_H=0x0100;
const WX_ALIGN_BOTTOM=0x0400, WX_ALIGN_CENTER_V=0x0800;
const WX_EXPAND=0x2000;
// Orientation, as the sizer enum has it (wxHORIZONTAL / wxVERTICAL) — read by
// the static line, the gauge and the slider. A NOTEBOOK's `orient` is a
// different enum in the same field: which edge its tab strip runs along.
const WX_VERTICAL=8;
const WX_AUI_NB_BOTTOM=8;

// Applied on every pass, so everything it can set it also clears: a layout
// block that went away leaves nothing behind.
function applyLayout(el, layout){
  const l=layout||{};
  const p=l.proportion|0, f=l.flag|0, b=l.border|0;
  // Main axis: proportion > 0 → share the remaining space.
  // Cross axis: only wxEXPAND stretches. proportion alone does NOT
  // imply cross-axis growth — desktop wxSizer treats them as
  // independent axes (form1 textctrl: prop=1, no EXPAND → grows
  // vertically, width stays natural).
  el.style.flexGrow=p>0?String(p):'';
  el.style.marginLeft  =(b>0&&(f & WX_LEFT))  ?b+'px':'';
  el.style.marginRight =(b>0&&(f & WX_RIGHT)) ?b+'px':'';
  el.style.marginTop   =(b>0&&(f & WX_TOP))   ?b+'px':'';
  el.style.marginBottom=(b>0&&(f & WX_BOTTOM))?b+'px':'';
  // Explicit align flags override the default flex-start.
  let align=(f & WX_EXPAND)?'stretch':'';
  if(f & WX_ALIGN_CENTER_V || f & WX_ALIGN_CENTER_H) align='center';
  else if(f & WX_ALIGN_RIGHT || f & WX_ALIGN_BOTTOM) align='flex-end';
  el.style.alignSelf=align;
}

// ---------------------------------------------------------------------------
// The reconciler. The DOM is kept, and each incoming tree is folded into it
// control by control: an element is found by its key (the control id, or
// type@index for a sizer, which has none), asked to bring itself up to date,
// and created afresh only when it says it cannot. What survives is what a
// rebuild threw away: the scroll position, the focus, the grid and its loaded
// pages.
//
// Every managed element carries oesCtrl (its renderer), oesKey, oesType and
// oesNode — the previous node without its children, which is what update
// compares against.
// ---------------------------------------------------------------------------
function nodeKey(node,index){
  return node.id!=null ? '#'+node.id : node.type+'@'+index;
}
function nodeMemo(node){
  const memo=Object.assign({},node);
  delete memo.children;
  return memo;
}

// Reconciles one node against the element that stood for it (or null) and
// returns the element that stands for it now. When existingEl is in parentEl
// the new element takes its place; otherwise a new element is appended.
function reconcile(parentEl, existingEl, node, layout, key){
  if(key===undefined) key=nodeKey(node,0);
  const ctrl=renderers[node.type]||fallback;
  let el=null;
  if(existingEl && existingEl.oesKey===key && existingEl.oesCtrl===ctrl
     && ctrl.update(existingEl,node,existingEl.oesNode||{})){
    el=existingEl;
  } else {
    el=ctrl.render(node);
    el.oesCtrl=ctrl; el.oesKey=key; el.oesType=node.type;
    if(node.id!=null) el.dataset.oesId=node.id;
    if(existingEl){
      if(existingEl.parentNode===parentEl) parentEl.replaceChild(el,existingEl);
      disposeEl(existingEl);
    } else if(parentEl) parentEl.appendChild(el);
  }
  el.oesNode=nodeMemo(node);
  ctrl.applyCommon(el,node);
  applyLayout(el,layout);
  // A control whose children are not widgets draws its own subtree: a
  // table's columns are a header, not eight boxes stacked under it.
  if(!ctrl.ownsChildren) reconcileChildren(el,node.children||[]);
  return el;
}

// The children of an ordinary container, matched by key: an element the
// renderer put there itself (a legend) carries no key and stays in front.
function reconcileChildren(parentEl, children){
  const spare=new Map();
  let lead=0;
  for(const c of Array.from(parentEl.children)){
    if(c.oesKey!==undefined) spare.set(c.oesKey,c);
    else if(spare.size===0) lead++;
  }
  const els=children.map((kid,i)=>{
    if(!kid||typeof kid!=='object') return null;
    const key=nodeKey(kid,i);
    const existing=spare.get(key)||null;
    spare.delete(key);
    return reconcile(parentEl,existing,kid,kid.layout,key);
  }).filter(Boolean);
  for(const c of spare.values()) disposeEl(c);
  els.forEach((el,i)=>{
    const at=parentEl.children[lead+i]||null;
    if(at!==el) parentEl.insertBefore(el,at);
  });
}

// Removes an element and lets every renderer below it let go of what it holds.
function disposeEl(el){
  el.remove();
  const stack=[el];
  while(stack.length){
    const e=stack.pop();
    if(e.oesCtrl) e.oesCtrl.dispose(e);
    for(const c of e.children) stack.push(c);
  }
}

// Focus across a pass. An element that is brought up to date keeps its focus
// by itself; one that had to be rebuilt loses it, and the input of the same
// control id gets it back, caret included.
function captureFocus(root){
  const a=document.activeElement;
  if(!a||!root.contains(a)) return null;
  const owner=a.closest('[data-oes-id]');
  const memo={el:a, id:owner?owner.dataset.oesId:null, start:null, end:null, dir:null};
  try{ memo.start=a.selectionStart; memo.end=a.selectionEnd; memo.dir=a.selectionDirection; }catch(_){}
  return memo;
}
function restoreFocus(memo, root){
  if(!memo || memo.el.isConnected || memo.id===null) return;
  const owner=root.querySelector(`[data-oes-id="${memo.id}"]`);
  if(!owner) return;
  // The same kind of element it lost: a text field's input, not the first
  // button that happens to be inside the control (a grid's command bar).
  const focusable=memo.el.matches('input,textarea')?'input,textarea':'button,select';
  const target=owner.matches(focusable)?owner:owner.querySelector(focusable);
  if(!target) return;
  target.focus({preventScroll:true});
  if(memo.start!==null && memo.start!==undefined){
    try{ target.setSelectionRange(memo.start,memo.end,memo.dir||'none'); }catch(_){}
  }
}

// ---------------------------------------------------------------------------
// Mounts. One retained DOM per host, keyed by the host's root id; a host
// object lives as long as its tab, and its id with it. The active one is
// shown and the others hidden, so a tab switch brings back the DOM it left —
// scroll position, loaded pages, the row somebody stood on.
//
// Each mount remembers the last `seq` it applied. A tree whose seq is not past
// it is the same state again (the stream echoing a direct answer) and is
// dropped; a tree without one is always applied.
//
// The sequence is the session's, not the host's, and it only goes up — so the
// highest seq applied anywhere is a floor as well. Without it a late frame for
// a host that has since been closed (a picker, a tab) would find no mount to
// compare against and be mounted: a dead form back on screen. The floor is
// reset only with the session.
// ---------------------------------------------------------------------------
const mounts=new Map();   // host id -> {el, container, seq}
let seqFloor=null;

function isStaleTree(tree){
  if(typeof tree.seq!=='number') return false;
  if(seqFloor!==null && tree.seq<=seqFloor) return true;
  const m=mounts.get(tree.id);
  return !!m && typeof m.seq==='number' && tree.seq<=m.seq;
}

// The single entry for every road that gets a tree.
function mount(container, tree){
  const key=nodeKey(tree,0);
  let m=mounts.get(tree.id);
  if(m && m.container!==container){ unmount(tree.id); m=null; }
  const memo=m?captureFocus(m.el):null;
  if(m){
    m.el=reconcile(container,m.el,tree,undefined,key);
  } else {
    m={el:reconcile(container,null,tree,undefined,key), container, seq:null};
    mounts.set(tree.id,m);
  }
  m.el.oesHostId=tree.id;
  if(typeof tree.seq==='number'){
    m.seq=tree.seq;
    if(seqFloor===null || tree.seq>seqFloor) seqFloor=tree.seq;
  }
  for(const o of mounts.values()) if(o.container===container) showMount(o,o===m);
  restoreFocus(memo,m.el);
  // The label column is measured once per pass, after layout.
  requestAnimationFrame(()=>alignLabelsGlobal(m.el));
  return m.el;
}
function showMount(m, visible){
  const wasHidden=m.el.hidden;
  m.el.hidden=!visible;
  // A grid laid out while its mount was hidden measured nothing, and rows
  // that arrived meanwhile were never laid out; a full redraw does both.
  if(visible && wasHidden)
    for(const host of m.el.querySelectorAll('.oes-tablebox'))
      if(host.oesGrid) host.oesGrid.table.redraw(true);
  syncPlaceholder();
}
function hideMounts(){
  for(const o of mounts.values()) showMount(o,false);
}
function unmount(id){
  const m=mounts.get(id);
  if(!m) return;
  mounts.delete(id);
  disposeEl(m.el);
  syncPlaceholder();
}
// The "Pick a form" line stands whenever no host is on screen in the content
// area.
const placeholder=main.querySelector('p');
function syncPlaceholder(){
  if(!placeholder) return;
  let shown=false;
  for(const o of mounts.values()) if(o.container===main && !o.el.hidden) shown=true;
  placeholder.hidden=shown;
}
// After the tab strip is re-read: a hidden mount whose host is on no tab is
// gone on the server, and goes here. The one on screen is left alone — a
// /session answer can predate the tree that mounted it, and a host that is
// truly gone is hidden by the next answer and disposed on the read after —
// unless the strip is empty, when nothing is open and every mount goes. A
// server that does not name hosts on its tabs gives nothing to compare
// against, so then too only an empty strip disposes.
function disposeOrphanMounts(tabs){
  const live=new Set();
  let named=false;
  for(const t of tabs){ if(t.host!==undefined){ named=true; live.add(t.host); } }
  if(tabs.length===0){ for(const id of Array.from(mounts.keys())) unmount(id); return; }
  if(!named) return;
  for(const [id,m] of Array.from(mounts)) if(!live.has(id) && m.el.hidden) unmount(id);
}

// Where a form tree is painted, decided once. Every road that gets a form back —
// a command, a control action, a cell commit, a tab switch, the live stream —
// has to make this decision, and each of them was making it by hand.
//
// A form the server opened as a value PICKER says so, and it is drawn OVER the
// form that asked rather than beside it: a choice is a question, and the form
// underneath must not be usable while the question stands. Anything else is the
// active form and goes to the content area — closing whatever dialog was up,
// because the server has moved on from it.
//
// Returns true when the tree is on screen (painted now, or already there).
let modalForm = null;   // {handle, id, following, body} — the picker currently up
function paintTree(tree){
  if(!tree || tree.error || Object.keys(tree).length===0) return false;
  if(isStaleTree(tree)){
    console.log(`tree ${tree.seq} for host ${tree.id} is already shown, dropped`);
    return true;
  }
  if(tree.modal) return paintModalForm(tree);
  closeModalForm();
  mount(main,tree);
  return true;
}

// The picker, in the dialog framework the client already has. Its body is a
// mount like any other, so an answer that carries the same picker again is
// reconciled into it rather than drawn afresh.
function paintModalForm(tree){
  if(modalForm && modalForm.id===tree.id){
    mount(modalForm.body,tree);
    return true;
  }
  closeModalForm();
  const body=document.createElement('div');
  body.className='oes-modal-form';
  const record={id:tree.id, following:false, handle:null, body};
  mount(body,tree);
  record.handle=OES.showDialog({
    dialogClass:'oes-form-dialog',
    title:tree.caption||'',
    body,
    // One button, and it is the way OUT. Choosing is the picker's own Select —
    // its toolbar carries it, first, the way the desktop's select form does —
    // so a second one in the footer would be two doors to one act. The default
    // footer is a lone "OK", which here would be an OK that cancels.
    buttons:[{label:L.cancel, onClick:(d)=>d.close()}],
    dismissible:true,
    // Walking away from the question is an answer too, and the server has to
    // hear it: the form is still open there, holding the control that asked.
    // `following` marks the closes that came FROM the server, which must not
    // be echoed back to it.
    onClose:()=>{
      if(record.following) return;
      if(modalForm===record) modalForm=null;
      unmount(record.id);
      closeModalFormOnServer();
    },
  });
  modalForm=record;
  return true;
}

// Walking away from the question is an answer, and the server has to hear it:
// the picker is still a form there, still holding the control that asked. It is
// closed the way any tab is (DELETE /tab/<i>), which runs beforeClose / onClose
// and tells the owner nothing — which is what a cancelled choice means.
//
// The index is asked for at the moment of dismissal rather than remembered: one
// noted when the dialog opened is a guess by the time it closes.
async function closeModalFormOnServer(){
  const info=await netFetch(API+'/session',{credentials:'same-origin'})
    .then(r=>r.json()).catch(()=>null);
  const tab=((info&&info.tabs)||[]).find(t=>t.modal);
  if(!tab) return;
  await paintFrom(API+'/tab/'+(tab.index|0),{method:'DELETE'});
  refreshTabs();
}

// The server closed it (a choice was made, a script closed the form): take the
// dialog down without telling the server what it already knows.
function closeModalForm(){
  if(!modalForm) return;
  const record=modalForm;
  modalForm=null;
  record.following=true;
  record.handle.close();
  unmount(record.id);
}


// Idempotent (re-running resets minWidth/display first).
function alignLabelsGlobal(rootEl){
  if(!rootEl) return;
  // A label marks itself: the renderer that draws one tags the row and the
  // caption inside it, so this reads two attributes rather than guessing at
  // which child of a row is the label.
  const labels=rootEl.querySelectorAll('[data-labelrow] > [data-label-host]');
  for(const lbl of labels){
    lbl.style.minWidth='';
    lbl.style.display='';
  }
  if(labels.length===0) return;
  // Global max across all captioned labels (any nesting depth).
  let maxW=0;
  for(const lbl of labels){
    if(lbl.textContent.length>0 && lbl.offsetWidth>maxW) maxW=lbl.offsetWidth;
  }
  if(maxW===0){
    // Nothing captioned anywhere — hide empty placeholders so flex gap
    // doesn't leak a visible indent.
    for(const lbl of labels){
      if(lbl.textContent.length===0) lbl.style.display='none';
    }
    return;
  }
  // Walk tree, applying maxW only to the eligible labels: within each
  // horizontal sizer, only the first labelrow gets the column; the rest
  // get their placeholders hidden so the column "breaks" at that point.
  applyLabelColumnWalk(rootEl, maxW, null);
}

function applyLabelColumnWalk(node, maxW, parentOrient){
  // parentOrient: 'horz' / 'vert' / null (non-sizer container — transparent).
  let horzColumnTaken=false;
  for(const c of node.children){
    const cls=c.classList;
    if(cls && cls.contains('boxsizer')){
      const childOrient=cls.contains('horz') ? 'horz' : 'vert';
      applyLabelColumnWalk(c, maxW, childOrient);
    } else if(c.dataset && c.dataset.labelrow){
      const lbl=c.querySelector(':scope > [data-label-host]');
      if(lbl){
        if(parentOrient==='horz' && horzColumnTaken){
          // Column already consumed by an earlier sibling in this horz
          // sizer — hide empty placeholder so it doesn't leave a visible
          // gap before the input.
          if(lbl.textContent.length===0) lbl.style.display='none';
        } else {
          lbl.style.minWidth=maxW+'px';
          if(parentOrient==='horz') horzColumnTaken=true;
        }
      }
    } else {
      // Transparent container (host root, non-sizer wrapper) — recurse
      // with the same orientation context.
      applyLabelColumnWalk(c, maxW, parentOrient);
    }
  }
}


// Poll the active host every few seconds so timer-driven updates surface
// between user actions. The tree is reconciled into the retained DOM, and one
// the mount has already shown (by seq) is dropped in paintTree. Pauses when
// the tab is hidden (visibility API) — no point fetching when the user isn't
// looking.
async function pollActive(){
  if (inflight > 0) return;
  const t0 = performance.now();
  try {
    const r = await netFetch(API+'/active', {credentials:'same-origin'});
    // 401 = session expired / server restarted / idle-timeout evicted.
    // Show a sticky banner with a reload button and stop polling — the
    // user has to reload to mint a fresh session + re-run OnStart.
    if (r.status === 401) { showSessionLost(); return; }
    if (!r.ok) { console.log(`poll /active: ${(performance.now()-t0).toFixed(1)}ms NOT OK`); return; }
    paintTree(await r.json());
    const dt = performance.now() - t0;
    if (dt > 300) console.log(`poll /active: ${dt.toFixed(1)}ms`);
  } catch (e) {
    console.log(`poll /active failed after ${(performance.now()-t0).toFixed(1)}ms`, e);
  }
}
// Poll /session in parallel with /active to pick up backend-pushed
// chrome updates (SetTitle / SetStatusText / Message / ClearMessage /
// BackendError) between user-driven actions. Same 2s cadence — within
// one poll-tick of any backend push. Drained server-side, so this
// won't replay the same lines repeatedly.
async function pollChrome(){
  try {
    const r = await netFetch(API+'/session', {credentials:'same-origin'});
    if (!r.ok) return;
    applyChromeFromSession(await r.json());
  } catch (e) { /* network blip — try again next tick */ }
}
let pollTimer = null;
function startPolling(){
  if (pollTimer) return;
  pollTimer = setInterval(() => { pollActive(); pollChrome(); }, 2000);
}
function stopPolling(){
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// Live updates via Server-Sent Events.
// Server pushes "data: <json>" frames when state changes (button click,
// timer tick, tab switch, script refresh). Falls back to 2s polling when
// EventSource is missing, connection errors, or the tab becomes hidden
// (SSE costs one open socket per tab — no point keeping it alive while
// the user isn't looking).
let liveSource = null;
// A frame off the stream. It is the same tree a direct answer carries, and
// most often the same seq: the mount drops the second of the pair.
function applyTreeText(text){
  if (!text || text === '{}') return;
  try {
    paintTree(JSON.parse(text));
  } catch (e) {
    console.log('stream frame unreadable', e);
  }
}
function startLive(){
  if (liveSource) return;
  if (typeof EventSource === 'undefined') { startPolling(); return; }
  try {
    // EventSource cannot carry a header, so the per-tab session id goes
    // in the query string -- the server reads ?sid= for exactly the
    // requests that can only send a URL. The cookie would answer too,
    // but it names ONE session for the whole browser, and every tab
    // here has its own; a second tab would have been listening to the
    // first tab's stream, and a browser that dropped the cookie got a
    // 401 and fell back to polling for the rest of the session.
    liveSource = new EventSource(API + '/stream?sid=' + encodeURIComponent(tabSid),
      { withCredentials: true });
  } catch (e) {
    console.log('SSE unavailable, falling back to polling', e);
    startPolling();
    return;
  }
  // SSE event = a server-side mutation happened. Apply the host tree
  // first, then fetch /session for chrome updates (title, status,
  // messages) the same event likely produced. Single round-trip latency
  // instead of waiting for the 2s pollChrome tick.
  liveSource.onmessage = ev => { applyTreeText(ev.data); pollChrome(); };
  liveSource.onerror = () => {
    // Either the server dropped us or the network flapped. Tear down
    // the EventSource and fall back to polling — polling renews the
    // error banner via netFetch on each failed cycle, so the user sees
    // the status. When the network recovers, the page reload (or next
    // startLive call on visibilitychange) re-upgrades to SSE.
    if (liveSource) { liveSource.close(); liveSource = null; }
    startPolling();
  };
  // If we upgrade to SSE mid-session, make sure the polling loop isn't
  // also firing — it would double up on server work.
  stopPolling();
}
function stopLive(){
  if (liveSource) { liveSource.close(); liveSource = null; }
}

// The development harness injects captured host trees into the real renderer
// through the same door every server answer takes, so a second fixture with
// the same root id is reconciled into the first. This path is query-gated and
// accepts only its same-origin parent.
if(rendererHarness){
  window.addEventListener('message',event=>{
    const data=event.data;
    if(event.origin!==location.origin || event.source!==parent ||
       !data || data.type!=='oes-render-fixture' ||
       !data.fixture || typeof data.fixture!=='object') return;
    stopLive();
    stopPolling();
    paintTree(data.fixture);
  });
}


// Session-lost banner — fires when /active returns 401 (server restart,
// idle-timeout eviction, or explicit destroy). Blocks the page so the
// user doesn't keep typing into inputs whose commits will silently fail,
// and offers a one-click reload to mint a fresh session.
let sessionLostShown = false;
async function checkMetaChanged(){
  // Best-effort — the /session endpoint carries metaGeneration even
  // when the session is gone (auth=false stub still includes it), so
  // this works both for live-session drift and post-eviction.
  try {
    const info = await netFetch(API+'/session', {credentials:'same-origin'}).then(r=>r.json());
    if (info && typeof info.metaGeneration === 'number') {
      if (initialMetaGen === null) initialMetaGen = info.metaGeneration;
      return info.metaGeneration !== initialMetaGen;
    }
  } catch (_) {}
  return false;
}
async function showSessionLost(){
  if (sessionLostShown) return;
  sessionLostShown = true;
  stopPolling(); stopLive();
  // The next session starts its sequence afresh.
  seqFloor = null;
  const configChanged = await checkMetaChanged();
  const overlay = document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.4);'
    +'display:flex;align-items:center;justify-content:center;z-index:9999';
  const box = document.createElement('div');
  box.style.cssText='background:#fff;padding:20px 24px;border-radius:6px;'
    +'box-shadow:0 6px 30px rgba(0,0,0,.3);max-width:400px;text-align:center';
  const msg = document.createElement('p');
  msg.textContent = configChanged
    ? L.configUpdated
    : L.sessionLost;
  msg.style.cssText='margin:0 0 16px 0;font-size:14px;color:#333';
  const btn = document.createElement('button');
  btn.textContent=L.reloadPage;
  btn.className='ctrl';
  btn.onclick=()=>location.reload();
  box.appendChild(msg); box.appendChild(btn);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
}
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden) { stopLive(); stopPolling(); }
  else if(!rendererHarness) { startLive(); }
});

// On session start, OnStart may have opened forms already. POST /tab/<active>
// activates the active tab on the server and answers with its tree, so the
// body paints on first load without waiting for a user click. No-op when the
// session has no tabs.
async function paintActiveTab(){
  const info=await netFetch(API+'/session',{credentials:'same-origin'}).then(r=>r.json());
  if(!info||!info.tabs||info.tabs.length===0) return;
  const active=info.activeTab|0;
  await paintFrom(API+'/tab/'+active,{method:'POST'});
}

// Tab strip overflow controls. The strip is overflow-x:auto; when the
// combined width of all tabs exceeds the container, reveal ‹ › buttons
// that scrollBy half a strip-width per click. ResizeObserver catches
// both window resizes and tab-count changes.
(function(){
  const prev = document.getElementById('tabs-prev');
  const next = document.getElementById('tabs-next');
  if (!prev || !next || !tabsBar) return;
  const step = () => Math.max(80, tabsBar.clientWidth * 0.6);
  prev.addEventListener('click', () => tabsBar.scrollBy({ left: -step(), behavior: 'smooth' }));
  next.addEventListener('click', () => tabsBar.scrollBy({ left:  step(), behavior: 'smooth' }));
  const sync = () => {
    const overflowing = tabsBar.scrollWidth > tabsBar.clientWidth + 1;
    prev.classList.toggle('visible', overflowing);
    next.classList.toggle('visible', overflowing);
  };
  new ResizeObserver(sync).observe(tabsBar);
  new MutationObserver(sync).observe(tabsBar, { childList: true });
  tabsBar.addEventListener('scroll', sync, { passive: true });
  sync();
})();

(async()=>{
  const bootOverlay = document.getElementById('bootOverlay');
  // Step 1: find out whether we need to prompt for credentials.
  const info = await authInfo();
  // Step 2: authenticate.
  // Open-access (no sys_user rows): loop auto-login until it succeeds.
  // The server's timed_mutex may reject under rapid-F5 contention;
  // retrying rather than falling to the form is correct because an
  // empty-creds form can't collect anything useful.
  // Populated sys_user: show the credentials form; promptLogin loops
  // internally until /login accepts the creds.
  let authenticated = false;
  if (!info.hasUsers) {
    authenticated = await login('', '');
  }
  if (!authenticated) {
    await promptLogin();   // resolves only on successful /login
    authenticated = true;
  }
  status.textContent = 'connected';
  // Step 3: initial fetches in parallel so the boot overlay hides only
  // after sidebar, tab strip, and active host have all landed — user
  // sees a finished page rather than elements popping in one by one.
  await Promise.all([
    loadForms().catch(() => {}),
    loadInterfaces().catch(() => {}),
    refreshTabs().catch(() => {}),
    paintActiveTab().catch(() => {}),
  ]);
  if(!rendererHarness) startLive();
  if (bootOverlay) {
    bootOverlay.classList.add('hide');
    setTimeout(() => bootOverlay.remove(), 200);
  }
  if(rendererHarness){
    parent.postMessage({type:'oes-renderer-ready'},location.origin);
  }
  // Debug indicator: a "DEBUG" pill in the sidebar status line while
  // the wes process is in --debug mode. When this tab's session parks
  // at a breakpoint, also takes over the top netStatus banner with
  // the paused caption, so the generic "Loading…" does not mask the real
  // reason. Polls /debug-status; cheap (in-memory flag check on wes).
  const dbgPill = document.createElement('span');
  dbgPill.className = 'dbg';
  dbgPill.style.display = 'none';
  status.appendChild(dbgPill);
  let dbgState = { debugMode: false, paused: false };
  async function pollDebugStatus(){
    try {
      const r = await fetch(API+'/debug-status',{credentials:'same-origin'});
      if (!r.ok) return;
      const next = await r.json();
      if (next.debugMode === dbgState.debugMode && next.paused === dbgState.paused)
        return;
      dbgState = next;
      dbgPaused = next.paused;
      dbgMode   = next.debugMode;
      if (next.paused) {
        dbgPill.textContent = 'PAUSED';
        dbgPill.className = 'dbg paused';
        dbgPill.style.display = '';
        showNetStatus('debug-paused',L.debuggerPaused);
        hideSpinner();
      } else {
        if (next.debugMode) {
          dbgPill.textContent = 'DEBUG';
          dbgPill.className = 'dbg mode';
          dbgPill.style.display = '';
        } else {
          dbgPill.style.display = 'none';
        }
        // Resume — clear the paused banner. inflight keeps its own
        // loading state, so it'll re-flash if a request is still slow.
        if (inflight === 0) hideNetStatus();
      }
    } catch (e) { /* network blip — try again next tick */ }
  }
  setInterval(pollDebugStatus, 500);
  pollDebugStatus();
})();
</script></body></html>
