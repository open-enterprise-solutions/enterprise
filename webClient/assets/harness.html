<!doctype html>
<html><head><meta charset="utf-8">
<title>OES renderer development harness</title>
<style>
:root{color-scheme:light dark}
body{margin:0;font:14px/1.4 system-ui,sans-serif;background:Canvas;color:CanvasText}
header{padding:.75rem 1rem;border-bottom:1px solid ButtonBorder}
h1{font-size:1.25rem;margin:0}header p{margin:.25rem 0 0}
#comparison{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1rem}
.sample{display:flex;flex-direction:column;min-width:0;height:calc(100vh - 7rem);border:1px solid ButtonBorder;background:Canvas}
.sample h2{font-size:1rem;margin:0;padding:.5rem .75rem;border-bottom:1px solid ButtonBorder}
iframe{display:block;flex:1 1 auto;width:100%;min-height:0;border:0;background:white}
@media (max-width:900px){#comparison{grid-template-columns:1fr}.sample{height:42rem}}
</style></head><body>
<header><h1>Development harness — not a product page</h1>
<p>The same captured form JSON is injected into two real client pages. Active axes: <span id="axes"></span>.</p></header>
<main id="comparison">
  <section class="sample"><h2>Legacy renderer</h2><iframe data-ui="legacy" title="Legacy renderer"></iframe></section>
  <section class="sample"><h2>UI5 renderer</h2><iframe data-ui="ui5" title="UI5 renderer"></iframe></section>
</main>
<script type="module">
const params=new URLSearchParams(location.search);
const oneOf=(value,allowed,fallback)=>allowed.includes(value)?value:fallback;
const theme=oneOf(params.get('theme'),['light','dark'],'light');
const density=oneOf(params.get('density'),['compact','comfortable'],'compact');
document.documentElement.dataset.oesTheme=theme;
document.documentElement.classList.toggle('ui5-content-density-compact',density==='compact');
document.getElementById('axes').textContent=theme+' theme, '+density+' density';

const fixtureResponse=await fetch('./harness-form.json');
if(!fixtureResponse.ok) throw new Error('Fixture request failed: '+fixtureResponse.status);
const fixture=await fixtureResponse.json();
const frames=[...document.querySelectorAll('iframe[data-ui]')];

window.addEventListener('message',event=>{
  if(event.origin!==location.origin || !event.data || event.data.type!=='oes-renderer-ready') return;
  const frame=frames.find(candidate=>candidate.contentWindow===event.source);
  if(!frame || frame.dataset.ui!==event.data.ui) return;
  event.source.postMessage({type:'oes-render-fixture',fixture},location.origin);
});

for(const frame of frames){
  // The client URL is one level above this assets page.
  const clientUrl=new URL('../',location.href);
  clientUrl.searchParams.set('ui',frame.dataset.ui);
  clientUrl.searchParams.set('theme',theme);
  clientUrl.searchParams.set('density',density);
  clientUrl.searchParams.set('harness','1');
  frame.src=clientUrl;
}
</script></body></html>
