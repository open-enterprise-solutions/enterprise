Locale = en

; How much the process may consume. A number is the most there may be; a key left out, or 0, means no limit,
; except Connections, where it keeps the built-in value, and ClientConnections, where 0 means 1000 (not no
; limit) and a number above 10000 is said and 10000 is used.
; Workers = 0       ; threads sessions run their work on, one pool for the whole process (grown as sessions bring work)
; Bases = 0         ; infobases one process may hold
; Connections = 0   ; connections to its DBMS a base may hold, unless its own infobase.conf says (32)
; ClientConnections = 0   ; client connections the application server holds at once (0 means 1000, at most 10000)
