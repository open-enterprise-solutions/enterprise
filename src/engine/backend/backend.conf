Locale = en

; How much the process may consume. A key left out, or 0, keeps the built-in value.
; Workers = 0       ; threads sessions run their work on, one pool for the whole process (web: 4 x cores up to 32, else 2)
; Bases = 0         ; infobases one process may hold (0 - as many as are opened)
; Connections = 0   ; connections to its DBMS a base may hold, unless its own infobase.conf says (32)
